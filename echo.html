<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c7a0f1">
    <title>EchoVerse - Your Echoes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        🌙
    </button>
    
    <button class="logout-btn" id="logoutBtn">Logout</button>

    <div class="container" style="margin-top: 80px;">
        <div class="logo-row" style="justify-content:center;">
            <button class="cta-button secret-button" id="secretPhotoBtn">Wanna  play a game</button>
        </div>
        <h1 class="page-title">EchoVerse</h1>
        
        <div class="composer">
            <textarea placeholder="Share your echo..." id="echoText" rows="4"></textarea>
            <div class="row">
                <button class="button primary" id="submitEcho">Post Echo</button>
            </div>
        </div>

        <div class="stories" id="echoStream">
            <p style="text-align: center; color: var(--current-muted);">Loading echoes...</p>
        </div>
    </div>

    <!-- Secret Question Modal -->
    <div id="secretQuestionModal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="secretQuestionTitle">
            <h2 id="secretQuestionTitle">What does he loves to eat?</h2>
            <input type="text" id="secretAnswer" placeholder="Type your answer" />
            <button class="cta-button" id="secretSubmit">Reveal</button>
            <p id="secretError" class="secret-error" aria-live="polite"></p>
        </div>
    </div>

    <!-- Secret Photo Modal -->
    <div id="secretPhotoModal" class="modal" aria-hidden="true">
        <div class="modal-content photo-modal" role="dialog" aria-modal="true" aria-labelledby="secretPhotoTitle">
            <h2 id="secretPhotoTitle">Make sure nobody is watchin</h2>
            <img id="secretPhoto" src="/assets/sample.png" alt="Secret" class="secret-photo" />
        </div>
    </div>

    <script type="module">
        // Check auth
        if (localStorage.getItem('echoverse_auth') !== 'true') {
            window.location.href = 'index.html';
        }

        // Check if user type is main
        if (localStorage.getItem('echoverse_user_type') === 'decoy') {
            window.location.href = 'whisper.html';
        }

        import { SUPABASE_URL, SUPABASE_KEY } from './config.js';

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'light' ? '🌙' : '☀️';
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'light' ? '🌙' : '☀️';
            localStorage.setItem('theme', newTheme);
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('echoverse_auth');
            localStorage.removeItem('echoverse_user_type');
            window.location.href = 'index.html';
        });

        // Secret question flow (main only)
        const secretBtn = document.getElementById('secretPhotoBtn');
        const secretQuestionModal = document.getElementById('secretQuestionModal');
        const secretPhotoModal = document.getElementById('secretPhotoModal');
        const secretAnswerInput = document.getElementById('secretAnswer');
        const secretSubmit = document.getElementById('secretSubmit');
        const secretError = document.getElementById('secretError');
        const secretAllowed = ['me','shreya'];
        const wrongMessages = [
            'Try Harder',
            'Wuttt you dontt knowwww thisss😵‍💫😵‍💫',
            'commmm onnnnnnn🥲 ',
            'i get it , You dont love me 😢😢',
            'Lastttt channnceee 😤😤',
            'Game Over 😵‍💫😵‍💫 , It was Youuuuu'

        ];
        let wrongCount = 0;

        const openSecretQuestion = () => {
            wrongCount = 0;
            secretError.textContent = '';
            secretAnswerInput.value = '';
            secretQuestionModal.style.display = 'flex';
            secretQuestionModal.setAttribute('aria-hidden', 'false');
            setTimeout(() => secretAnswerInput.focus(), 50);
        };

        const closeSecretQuestion = () => {
            secretQuestionModal.style.display = 'none';
            secretQuestionModal.setAttribute('aria-hidden', 'true');
        };

        const openSecretPhoto = () => {
            secretPhotoModal.style.display = 'flex';
            secretPhotoModal.setAttribute('aria-hidden', 'false');
        };

        const closeSecretPhoto = () => {
            secretPhotoModal.style.display = 'none';
            secretPhotoModal.setAttribute('aria-hidden', 'true');
        };

        secretBtn?.addEventListener('click', openSecretQuestion);

        secretSubmit?.addEventListener('click', () => {
            const answer = secretAnswerInput.value.trim().toLowerCase();
            if (secretAllowed.includes(answer)) {
                closeSecretQuestion();
                alert('Make sure nobody is watchin');
                openSecretPhoto();
            } else {
                const message = wrongMessages[Math.min(wrongCount, wrongMessages.length - 1)];
                secretError.textContent = message;
                wrongCount += 1;
            }
        });

        secretAnswerInput?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') secretSubmit.click();
        });

        secretQuestionModal?.addEventListener('click', (e) => {
            if (e.target === secretQuestionModal) closeSecretQuestion();
        });

        secretPhotoModal?.addEventListener('click', (e) => {
            if (e.target === secretPhotoModal) closeSecretPhoto();
        });

        // Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Submit Echo
        const submitEcho = document.getElementById('submitEcho');
        const echoText = document.getElementById('echoText');

        submitEcho.addEventListener('click', async () => {
            const content = echoText.value.trim();
            if (!content) return;

            submitEcho.disabled = true;
            submitEcho.textContent = 'Posting...';

            try {
                const { error } = await supabaseClient
                    .from('echoes')
                    .insert([{ 
                        content, 
                        created_at: new Date(),
                        channel: 'main'
                    }]);

                if (error) throw error;

                echoText.value = '';
                await loadEchoes();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to post echo');
            } finally {
                submitEcho.disabled = false;
                submitEcho.textContent = 'Post Echo';
            }
        });

        // Load Echoes
        async function loadEchoes() {
            try {
                const { data, error } = await supabaseClient
                    .from('echoes')
                    .select('*')
                    .or('channel.eq.main,channel.is.null')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const echoStream = document.getElementById('echoStream');
                
                if (!data || data.length === 0) {
                    echoStream.innerHTML = '<p style="text-align: center; color: var(--current-muted);">No echoes yet. Be the first!</p>';
                    return;
                }

                echoStream.innerHTML = '';

                data.forEach(echo => {
                    const date = new Date(echo.created_at);
                    const timeAgo = formatTime(date);
                    const card = document.createElement('div');
                    card.className = 'story fade-in';
                    card.innerHTML = `
                        <div class="meta">${timeAgo}</div>
                        <div class="content">${escapeHtml(echo.content)}</div>
                    `;
                    echoStream.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('echoStream').innerHTML = '<p style="text-align: center; color: #ff6b6b;">Failed to load echoes</p>';
            }
        }

        function formatTime(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hrs ago';
            if (seconds < 2592000) return Math.floor(seconds / 86400) + ' days ago';
            return date.toLocaleDateString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load on start
        loadEchoes();

        // Auto refresh every 30 seconds
        setInterval(loadEchoes, 30000);
    </script>
</body>
</html>
