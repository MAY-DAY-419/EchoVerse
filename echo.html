<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#c7a0f1">
    <title>EchoVerse - Your Echoes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        🌙
    </button>
    
    <button class="logout-btn" id="logoutBtn">Logout</button>

    <div class="container" style="margin-top: 80px;">
        <h1 class="page-title">EchoVerse</h1>
        
        <div class="composer">
            <textarea placeholder="Share your echo..." id="echoText" rows="4"></textarea>
            <div class="row">
                <button class="button primary" id="submitEcho">Post Echo</button>
            </div>
        </div>

        <div class="stories" id="echoStream">
            <p style="text-align: center; color: var(--current-muted);">Loading echoes...</p>
        </div>
    </div>

    <!-- Secret Question Modal -->
    <div id="secretQuestionModal" class="modal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="secretQuestionTitle">
            <h2 id="secretQuestionTitle">What does he loves to eat?</h2>
            <input type="text" id="secretAnswer" placeholder="Type your answer" />
            <button class="cta-button" id="secretSubmit">Reveal</button>
            <p id="secretError" class="secret-error" aria-live="polite"></p>
        </div>
    </div>

    <!-- Secret Photo Modal -->
    <div id="secretPhotoModal" class="modal" aria-hidden="true">
        <div class="modal-content photo-modal" role="dialog" aria-modal="true" aria-labelledby="secretPhotoTitle">
            <h2 id="secretPhotoTitle">BEAUTY</h2>
            <img id="secretPhoto" alt="Secret" class="secret-photo" />
        </div>
    </div>

    <script type="module">
        // Check auth
        if (localStorage.getItem('echoverse_auth') !== 'true') {
            window.location.href = 'index.html';
        }

        // Check if user type is main
        if (localStorage.getItem('echoverse_user_type') === 'decoy') {
            window.location.href = 'whisper.html';
        }

        import { SUPABASE_URL, SUPABASE_KEY } from './config.js';

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'light' ? '🌙' : '☀️';
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'light' ? '🌙' : '☀️';
            localStorage.setItem('theme', newTheme);
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('echoverse_auth');
            localStorage.removeItem('echoverse_user_type');
            window.location.href = 'index.html';
        });

        // Secret question flow (main only)
        const secretBtn = document.getElementById('secretPhotoBtn');
        const secretQuestionModal = document.getElementById('secretQuestionModal');
        const secretPhotoModal = document.getElementById('secretPhotoModal');
        const secretAnswerInput = document.getElementById('secretAnswer');
        const secretSubmit = document.getElementById('secretSubmit');
        const secretError = document.getElementById('secretError');
        const secretAllowed = ['me','shreya'];
        const wrongMessages = [
            'Try Harder',
            'Wuttt you dontt knowwww thisss😵‍💫😵‍💫',
            'commmm onnnnnnn🥲 ',
            'i get it , You dont love me 😢😢',
            'Lastttt channnceee 😤😤',
            'Game Over 😵‍💫😵‍💫 , It was Youuuuu'

        ];
        let wrongCount = 0;

        const openSecretQuestion = () => {
            wrongCount = 0;
            secretError.textContent = '';
            secretAnswerInput.value = '';
            secretQuestionModal.style.display = 'flex';
            secretQuestionModal.setAttribute('aria-hidden', 'false');
            setTimeout(() => secretAnswerInput.focus(), 50);
        };

        const closeSecretQuestion = () => {
            secretQuestionModal.style.display = 'none';
            secretQuestionModal.setAttribute('aria-hidden', 'true');
        };

        const SECRET_PHOTO_PATH = '/assets/sample.png';
        const SECRET_PHOTO_HASH = '9CD09AACC99525D7ADBA78DFFE10BA131600D710E696497F5B99C931C07313FB'; // SHA-256 (HEX)

        const openSecretPhoto = () => {
            secretPhotoModal.style.display = 'flex';
            secretPhotoModal.setAttribute('aria-hidden', 'false');
        };

        const toHex = (buffer) => {
            const bytes = new Uint8Array(buffer);
            let hex = '';
            for (let i = 0; i < bytes.length; i++) {
                hex += bytes[i].toString(16).padStart(2, '0');
            }
            return hex.toUpperCase();
        };

        const verifyAndShowSecretPhoto = async () => {
            try {
                const resp = await fetch(SECRET_PHOTO_PATH, { cache: 'no-store' });
                if (!resp.ok) throw new Error('Failed to fetch image');
                const buf = await resp.arrayBuffer();
                const digest = await crypto.subtle.digest('SHA-256', buf);
                const hex = toHex(digest);
                if (hex === SECRET_PHOTO_HASH) {
                    const imgEl = document.getElementById('secretPhoto');
                    imgEl.src = SECRET_PHOTO_PATH;
                    openSecretPhoto();
                } else {
                    alert('Image failed integrity check.');
                }
            } catch (e) {
                console.error('Integrity check error:', e);
                alert('Could not verify image integrity.');
            }
        };

        const closeSecretPhoto = () => {
            secretPhotoModal.style.display = 'none';
            secretPhotoModal.setAttribute('aria-hidden', 'true');
        };

        secretBtn?.addEventListener('click', openSecretQuestion);

        secretSubmit?.addEventListener('click', () => {
            const answer = secretAnswerInput.value.trim().toLowerCase();
            if (secretAllowed.includes(answer)) {
                closeSecretQuestion();
                alert('Make sure nobody is watchin');
                verifyAndShowSecretPhoto();
            } else {
                const message = wrongMessages[Math.min(wrongCount, wrongMessages.length - 1)];
                secretError.textContent = message;
                wrongCount += 1;
            }
        });

        secretAnswerInput?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') secretSubmit.click();
        });

        secretQuestionModal?.addEventListener('click', (e) => {
            if (e.target === secretQuestionModal) closeSecretQuestion();
        });

        secretPhotoModal?.addEventListener('click', (e) => {
            if (e.target === secretPhotoModal) closeSecretPhoto();
        });

        // Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Device identity for reaction toggle
        const DEVICE_ID_KEY = 'echoverse_device_id';
        let DEVICE_ID = localStorage.getItem(DEVICE_ID_KEY);
        if (!DEVICE_ID) {
            DEVICE_ID = (self.crypto?.randomUUID?.() || Math.random().toString(36).slice(2));
            localStorage.setItem(DEVICE_ID_KEY, DEVICE_ID);
        }

        // Submit Echo
        const submitEcho = document.getElementById('submitEcho');
        const echoText = document.getElementById('echoText');

        submitEcho.addEventListener('click', async () => {
            const content = echoText.value.trim();
            if (!content) return;

            submitEcho.disabled = true;
            submitEcho.textContent = 'Posting...';

            try {
                const { error } = await supabaseClient
                    .from('echoes')
                    .insert([{ 
                        content, 
                        created_at: new Date(),
                        channel: 'main'
                    }]);

                if (error) throw error;

                echoText.value = '';
                await loadEchoes();
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to post echo');
            } finally {
                submitEcho.disabled = false;
                submitEcho.textContent = 'Post Echo';
            }
        });

        // Reactions config (WhatsApp-style long press)
        const EMOJIS = ['❤️','😂','👍','😮','😢'];
        let holdTimer = null;
        let holdTarget = null;
        let currentPopover = null;
        let currentPopoverEchoId = null;
        const reactionInFlight = new Set();
        const debounceRefresh = new Map();

        // Load Echoes
        async function loadEchoes() {
            try {
                const { data, error } = await supabaseClient
                    .from('echoes')
                    .select('id, content, created_at, channel')
                    .or('channel.eq.main,channel.is.null')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const echoStream = document.getElementById('echoStream');
                
                if (!data || data.length === 0) {
                    echoStream.innerHTML = '<p style="text-align: center; color: var(--current-muted);">No echoes yet. Be the first!</p>';
                    return;
                }

                echoStream.innerHTML = '';

                data.forEach((echo) => {
                    const date = new Date(echo.created_at);
                    const timeAgo = formatTime(date);
                    const card = document.createElement('div');
                    card.className = 'story fade-in';
                    card.setAttribute('data-echo-id', echo.id);
                    card.innerHTML = `
                        <div class="meta">${timeAgo}</div>
                        <div class="content">${escapeHtml(echo.content)}</div>
                    `;
                    echoStream.appendChild(card);
                        // Load and render chips if reactions exist
                        getReactionCounts(echo.id)
                            .then(counts => renderReactionChips(card, counts))
                            .catch(() => {});
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('echoStream').innerHTML = '<p style="text-align: center; color: #ff6b6b;">Failed to load echoes</p>';
            }
        }
        
        async function getReactionCounts(echoId) {
            const { data, error } = await supabaseClient
                .from('echo_reactions')
                .select('emoji')
                .eq('echo_id', echoId);
            if (error) throw error;
            const counts = {};
            for (const emoji of EMOJIS) counts[emoji] = 0;
            data.forEach(row => { if (counts[row.emoji] !== undefined) counts[row.emoji] += 1; });
            return counts;
        }
        
            function renderReactionChips(cardEl, counts) {
                const total = Object.values(counts).reduce((a,b)=>a+(b||0),0);
                let chips = cardEl.querySelector('.reaction-chips');
                if (total === 0) {
                    if (chips) chips.remove();
                    return;
                }
                if (!chips) {
                    chips = document.createElement('div');
                    chips.className = 'reaction-chips';
                    cardEl.appendChild(chips);
                }
                const entries = Object.entries(counts).filter(([,c]) => c>0);
                entries.sort((a,b)=>b[1]-a[1]);
                chips.innerHTML = entries.map(([emoji,c]) => `
                    <span class="reaction-chip" data-emoji="${emoji}">
                        <span class="emoji">${emoji}</span>
                        <span class="cnt">${c}</span>
                    </span>
                `).join('');
            }

        async function addReaction(echoId, emoji, btnEl) {
            try {
                if (reactionInFlight.has(echoId)) return; // guard duplicate rapid taps
                reactionInFlight.add(echoId);
                if (btnEl) btnEl.disabled = true;

                // Toggle: if this exact emoji exists for my device, remove it; else add
                const { data: mine, error: findErr } = await supabaseClient
                    .from('echo_reactions')
                    .select('id')
                    .eq('echo_id', echoId)
                    .eq('emoji', emoji)
                    .eq('device_id', DEVICE_ID)
                    .limit(1);
                if (findErr) throw findErr;

                if (mine && mine.length) {
                    // Remove this reaction
                    const { error: delErr } = await supabaseClient
                        .from('echo_reactions')
                        .delete()
                        .eq('id', mine[0].id);
                    if (delErr) throw delErr;
                } else {
                    // Add new reaction
                    const { error: insErr } = await supabaseClient
                        .from('echo_reactions')
                        .insert([{ echo_id: echoId, emoji, device_id: DEVICE_ID, created_at: new Date() }]);
                    if (insErr) throw insErr;
                }

                // Re-fetch authoritative counts and render chips
                const card = document.querySelector(`[data-echo-id="${echoId}"]`);
                if (card) {
                    try {
                        const counts = await getReactionCounts(echoId);
                        renderReactionChips(card, counts);
                    } catch {}
                }
            } catch (e) {
                console.error('Add reaction failed:', e);
                alert('Unable to add reaction.');
            } finally {
                if (btnEl) btnEl.disabled = false;
                reactionInFlight.delete(echoId);
            }
        }
        
        // Long-press / right-click to open reactions popover
        const streamEl = document.getElementById('echoStream');

        function startHold(targetEl, clientX, clientY) {
            clearHold();
            holdTarget = targetEl.closest('[data-echo-id]');
            if (!holdTarget) return;
            holdTimer = setTimeout(() => {
                const echoId = holdTarget.getAttribute('data-echo-id');
                openReactionPopover(echoId, clientX, clientY);
            }, 350);
        }

        function clearHold() {
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
            holdTarget = null;
        }

        streamEl.addEventListener('mousedown', (e) => {
            if (!(e.target instanceof Element)) return;
            startHold(e.target, e.clientX, e.clientY);
        });
        streamEl.addEventListener('mouseup', clearHold);
        streamEl.addEventListener('mouseleave', clearHold);

        streamEl.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            const target = document.elementFromPoint(t.clientX, t.clientY) || e.target;
            startHold(target, t.clientX, t.clientY);
        }, { passive: true });
        streamEl.addEventListener('touchend', clearHold, { passive: true });
        streamEl.addEventListener('touchcancel', clearHold, { passive: true });

        streamEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (!(e.target instanceof Element)) return;
            const card = e.target.closest('[data-echo-id]');
            if (!card) return;
            openReactionPopover(card.getAttribute('data-echo-id'), e.clientX, e.clientY);
        });

        function ensurePopover() {
            if (currentPopover) return currentPopover;
            const pop = document.createElement('div');
            pop.className = 'reaction-popover';
            pop.innerHTML = `
                <div class="reaction-row">
                    ${EMOJIS.map(e => `<button class=\"reaction-option\" data-emoji=\"${e}\" aria-label=\"React ${e}\">${e}</button>`).join('')}
                    <button class="reaction-option keyboard" data-keyboard="true" aria-label="More">⌨️</button>
                </div>
                <input class="reaction-input" type="text" placeholder="Pick emoji…" aria-label="Emoji input" />
            `;
            document.body.appendChild(pop);

            // Click handlers
            pop.addEventListener('click', async (ev) => {
                const btn = ev.target.closest('.reaction-option');
                if (!btn) return;
                if (btn.hasAttribute('data-keyboard')) {
                    const input = pop.querySelector('.reaction-input');
                    input.focus();
                    return;
                }
                const emoji = btn.getAttribute('data-emoji');
                if (!emoji || !currentPopoverEchoId) return;
                await addReaction(currentPopoverEchoId, emoji, btn);
                closeReactionPopover();
            });

            const input = pop.querySelector('.reaction-input');
            input.addEventListener('input', async () => {
                const val = input.value.trim();
                if (!val) return;
                const first = Array.from(val)[0];
                if (!first) return;
                if (currentPopoverEchoId) await addReaction(currentPopoverEchoId, first, input);
                input.value = '';
                closeReactionPopover();
            });

            // Dismiss on outside click
            document.addEventListener('click', (evt) => {
                if (!currentPopover) return;
                if (evt.target instanceof Element && !currentPopover.contains(evt.target)) {
                    closeReactionPopover();
                }
            });
            window.addEventListener('scroll', closeReactionPopover, { passive: true });

            currentPopover = pop;
            return pop;
        }

        async function openReactionPopover(echoId, clientX, clientY) {
            const pop = ensurePopover();
            currentPopoverEchoId = echoId;
            // Position
            const pad = 8;
            const { innerWidth: vw, innerHeight: vh } = window;
            pop.style.visibility = 'hidden';
            pop.style.display = 'block';
            // temp to compute size
            const width = pop.offsetWidth || 220;
            const height = pop.offsetHeight || 56;
            let left = Math.max(pad, Math.min(vw - width - pad, clientX - width / 2));
            let top = Math.max(pad, Math.min(vh - height - pad, clientY - height - 12));
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            pop.style.visibility = 'visible';

            // Load counts into title tooltips (optional)
            try {
                const counts = await getReactionCounts(echoId);
                EMOJIS.forEach(e => {
                    const b = pop.querySelector(`.reaction-option[data-emoji="${e}"]`);
                    if (b) b.title = `${counts[e] || 0}`;
                });
            } catch {}
        }

        function closeReactionPopover() {
            if (!currentPopover) return;
            currentPopover.style.display = 'none';
            currentPopoverEchoId = null;
        }

        // Supabase Realtime: refresh chips on inserts/deletes
        try {
            const channel = supabaseClient.channel('echo_reactions_live');
            const schedule = (echoId) => {
                if (!echoId) return;
                const existing = debounceRefresh.get(echoId);
                if (existing) clearTimeout(existing);
                const t = setTimeout(async () => {
                    debounceRefresh.delete(echoId);
                    const card = document.querySelector(`[data-echo-id="${echoId}"]`);
                    if (!card) return;
                    try {
                        const counts = await getReactionCounts(echoId);
                        renderReactionChips(card, counts);
                    } catch {}
                }, 250);
                debounceRefresh.set(echoId, t);
            };

            channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'echo_reactions' }, (payload) => {
                schedule(payload?.new?.echo_id);
            });
            channel.on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'echo_reactions' }, (payload) => {
                schedule(payload?.old?.echo_id);
            });
            channel.subscribe();
        } catch (e) {
            console.debug('Realtime setup skipped/unavailable', e);
        }

        function formatTime(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hrs ago';
            if (seconds < 2592000) return Math.floor(seconds / 86400) + ' days ago';
            return date.toLocaleDateString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load on start
        loadEchoes();

        // Auto refresh every 30 seconds
        setInterval(loadEchoes, 30000);
    </script>
</body>
</html>
